# Complément de configuration pour l'image officielle : serveur de test sans TLS (jamais pour la production).
listen = *
ssl = no
auth_allow_cleartext = yes
auth_mechanisms = plain login

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
  }
  mailbox Sent {
    special_use = \Sent
  }
  mailbox Trash {
    special_use = \Trash
  }
}

sieve_script personal {
  driver = file
  path = ~/sieve
  active_path = ~/.dovecot.sieve
}

auth_verbose = yes
