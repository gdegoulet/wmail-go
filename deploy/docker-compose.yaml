# wmail-go derrière nginx (terminaison TLS). Usage :
#
#   make tls-cert      engendre un certificat auto-signé dans deploy/certs/ (valable 825 jours)
#   make tls-up        démarre nginx + wmail-go        https://localhost:8443
#   make tls-logs      journaux des deux conteneurs
#   make tls-down      arrête l'ensemble
#
# wmail-go n'écoute QUE sur le réseau interne du compose : aucun port en clair n'est publié.
# nginx ajoute X-Forwarded-Proto et X-Forwarded-For ; config/config.https.json pose trusted_proxy: true,
# sans quoi l'application ignorerait ces en-têtes (et n'enverrait pas Strict-Transport-Security).

name: wmail-go-tls

services:
  webmail:
    build:
      context: ..
      target: runtime
    image: localhost/wmail-go:dev
    expose:
      - "8080"
    volumes:
      - ../config/config.https.json:/config/config.json:ro
      - wmail-go-data:/data
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  nginx:
    # Image « unprivileged » : nginx tourne en uid 101, sans aucune capacité (l'image standard veut chown son cache).
    image: docker.io/nginxinc/nginx-unprivileged:1.27-alpine
    depends_on:
      - webmail
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
      - ./certs:/etc/nginx/certs:ro,Z
    tmpfs:            # système de fichiers en lecture seule : nginx écrit ses fichiers temporaires en mémoire
      - /tmp:mode=1777
      - /var/cache/nginx:mode=1777
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  wmail-go-data:   # volume distinct de celui du développement : les comptes ne sont pas partagés
