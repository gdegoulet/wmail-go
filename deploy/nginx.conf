# Terminaison TLS devant wmail-go. Le certificat auto-signé est engendré par « make tls-cert ».

server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/wmail-go.crt;
    ssl_certificate_key /etc/nginx/certs/wmail-go.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1h;
    ssl_session_tickets off;

    # Pièces jointes : la limite de l'application est de 30 Mo par message, on laisse un peu de marge.
    client_max_body_size 64m;
    client_body_timeout  120s;
    proxy_read_timeout   300s;  # une recherche sur une grosse boîte peut être longue
    proxy_send_timeout   300s;

    # L'application pose elle-même CSP, X-Frame-Options, Referrer-Policy et HSTS : nginx n'ajoute rien
    # (une deuxième valeur de CSP serait appliquée en plus de la nôtre, donc plus restrictive par accident).
    server_tokens off;

    location / {
        proxy_pass http://webmail:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto https;   # sans cela, pas de cookie « Secure » ni de HSTS
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header Connection        "";
        proxy_buffering off;   # le téléchargement d'une pièce jointe commence tout de suite
    }
}
