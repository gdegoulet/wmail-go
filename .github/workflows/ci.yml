# Intégration continue : construction, analyse statique et tests. Tout tourne dans des conteneurs, comme en local.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go (vet, tests, course)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'   # dernier correctif de la série : go.mod fixerait 1.26.0, déjà corrigé en amont
          check-latest: true
      - name: Format
        run: test -z "$(gofmt -l ./cmd ./internal)" || { gofmt -l ./cmd ./internal; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Tests avec détecteur de concurrence
        run: go test -race -count=1 ./...

  vuln:
    name: Vulnérabilités connues (govulncheck)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'   # idem : avec go.mod, govulncheck signalerait les avis déjà corrigés en 1.26.1
          check-latest: true
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  js:
    name: Contrôles JavaScript (jsdom)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Contrôles jsdom sur les pages réelles (conteneurs)
        run: |
          set -o pipefail
          sh -x ./tools/jstest/run.sh 2>&1 | tee /tmp/js.log
      # Les journaux d'exécution ne sont lisibles qu'avec les droits d'administration du dépôt ; les
      # annotations, elles, sont publiques. On y recopie la fin de la trace pour pouvoir diagnostiquer.
      - name: Détail de l'échec (annotation publique)
        if: failure()
        run: |
          docker compose --profile test --profile dev logs --tail=60 >>/tmp/js.log 2>&1 || true
          python3 -c "import sys;t=open('/tmp/js.log',errors='replace').read().splitlines()[-80:];print('::error title=echec-jsdom::'+'%0A'.join(l.replace('%','%25') for l in t))"

  image:
    name: Image de conteneur
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Construction
        run: docker build --target runtime -t wmail-go:ci .
      - name: Taille de l'image
        run: docker image inspect wmail-go:ci --format 'Taille (octets) = {{.Size}}'
