# Veille de sécurité : govulncheck chaque lundi, même sans modification du code.
# Une faille publiée après la dernière fusion est ainsi détectée sans attendre la prochaine contribution.
name: Veille de vulnérabilités

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'   # dernier correctif : go.mod fixerait 1.26.0, dont la bibliothèque standard est visée
          check-latest: true
      - name: Analyse
        id: scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./... | tee rapport.txt
      - name: Ouvrir un ticket en cas de faille atteignable
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `govulncheck : vulnérabilité atteignable (${new Date().toISOString().slice(0, 10)})`,
              body: `La veille hebdomadaire a signalé au moins une vulnérabilité atteignable depuis notre code.\n\nJournal : ${run}\n\nMarche à suivre : \`make vuln\` en local, puis \`make deps-update\` ou mise à jour ciblée du module concerné.`,
              labels: ['sécurité'],
            });
